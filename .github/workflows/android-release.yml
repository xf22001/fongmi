name: Android Release Build and Publish

on:
  workflow_dispatch:  # Manual trigger
    inputs:
      log_level:
        description: 'Gradle log level'
        required: true
        default: 'info'
        type: choice
        options:
          - info
          - debug
          - quiet

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release Android App
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Set up Android NDK for native libraries
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          cache: true

      # Set up Python 3.10 for Chaquopy
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      # Install system dependencies that might be needed for Python packages and native compilation
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev build-essential libffi-dev libxml2-dev libxslt1-dev libssl-dev libc6-dev

      # Grant execute permissions for gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Decode Keystore and Set Signing Environment Variables
      - name: Decode Keystore and Set Signing Environment Variables
        run: |
          # Parse the combined secret string
          SIGNING_INFO="${{ secrets.ANDROID_SIGNING_COMBINED_SECRET }}"
          KEYSTORE_BASE64=$(echo "$SIGNING_INFO" | cut -d'|' -f1)
          KEYSTORE_PASSWORD=$(echo "$SIGNING_INFO" | cut -d'|' -f2)
          KEY_ALIAS=$(echo "$SIGNING_INFO" | cut -d'|' -f3)
          KEY_PASSWORD=$(echo "$SIGNING_INFO" | cut -d'|' -f4)

          # Check if all parts were successfully parsed
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Error: Failed to parse ANDROID_SIGNING_COMBINED_SECRET. One or more parts are empty."
            exit 1
          fi

          # Decode the Base64 encoded keystore and save it to app/ directory
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release.jks

          echo "SIGNING_KEYSTORE_FILE=$(pwd)/app/release.jks" >> $GITHUB_ENV
          echo "SIGNING_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
          echo "SIGNING_KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
          echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
        shell: bash

      # The SIGNING_KEYSTORE_FILE, SIGNING_KEYSTORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD
      # environment variables are already set and will be used by the build.gradle configuration

      # Build all release variants using Gradle with signing properties from environment
      # The project has multiple product flavors: leanback/mobile, arm64_v8a/armeabi_v7a, prod/dev
      # This will generate APKs for all combinations
      - name: Build release APKs with Gradle
        run: ./gradlew assembleRelease --${{ github.event.inputs.log_level }}


      # Find and list all generated APKs
      - name: List generated APKs
        run: find . -name "*.apk" -type f

      # List all files in build directories to see the actual structure
      - name: List all build output files
        run: find . -path "*/build/outputs/*" -type f

      # Verify that APKs were generated before proceeding
      - name: Verify APKs exist
        run: |
          if [ -z "$(find . -name "*.apk" -type f)" ]; then
            echo "Error: No APK files were generated by the build process!"
            exit 1
          else
            echo "Found APK files, build was successful."
            find . -name "*.apk" -type f
          fi

      # Upload all release APKs as artifacts
      - name: Upload APKs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: '**/build/outputs/apk/**/release/*.apk'
          retention-days: 7

      # Extract version name from build.gradle
      - name: Extract version name
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName "\K[^\"]*' app/build.gradle)
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION_NAME"

      # Generate a unique release tag based on the current date and time and branch name
      - name: Generate Release Tag
        id: generate_tag
        run: echo "tag_name=v$(date +'%Y-%m-%d-%H-%M-%S')-${{ github.ref_name }}" >> $GITHUB_OUTPUT

      # Upload APKs to a new Release using the generated tag
      - name: Upload APKs to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.generate_tag.outputs.tag_name }}
          name: Release ${{ steps.generate_tag.outputs.tag_name }}
          body: |
            Automated release triggered via workflow_dispatch
            Built from branch: ${{ github.ref_name }}
            Built from commit: ${{ github.sha }}

            Version: ${{ steps.version.outputs.version_name }}
            This release includes APKs for different device types:
            - leanback: For TV devices (Android TV)
            - mobile: For mobile devices (phones/tablets)

            And for different architectures:
            - arm64_v8a: For 64-bit ARM devices
            - armeabi_v7a: For 32-bit ARM devices
          files: |
            **/build/outputs/apk/**/release/*.apk
          draft: true
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}