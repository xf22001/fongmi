name: Android Release Build and Publish

on:
  workflow_dispatch:
    inputs:
      log_level:
        description: 'Gradle log level'
        required: true
        default: 'info'
        type: choice
        options:
          - info
          - debug
          - quiet

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          cache: true

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          python -m pip install --upgrade pip
          sudo apt-get update
          sudo apt-get install -y python3-dev build-essential libffi-dev libxml2-dev libxslt1-dev libssl-dev libc6-dev

      - name: Grant execute permission for scripts
        run: |
          chmod +x ./gradlew
          chmod +x ./setup_conda.sh
          chmod +x ./chaquo_build/gradlew

      - name: Synchronize source to chaquo_build
        run: |
          rm -rf chaquo_build/catvod/src chaquo_build/chaquo/src
          cp -r catvod/src chaquo_build/catvod/
          cp catvod/proguard-rules.pro chaquo_build/catvod/ || true
          cp -r chaquo/src chaquo_build/chaquo/
          cp chaquo/requirements.txt chaquo_build/chaquo/
          cp chaquo/proguard-rules.pro chaquo_build/chaquo/ || true

      # Step 1: Independent Chaquopy AAR Build (Decoupled to avoid Gradle conflicts)
      - name: Build Chaquopy AAR
        run: |
          ./setup_conda.sh
          cd chaquo_build
          ./gradlew :chaquo:assembleRelease --no-daemon
          mkdir -p ../app/libs
          cp chaquo/build/outputs/aar/chaquo-release.aar ../app/libs/

      - name: Decode Keystore and Set Signing Environment Variables
        run: |
          SIGNING_INFO="${{ secrets.ANDROID_SIGNING_COMBINED_SECRET }}"
          KEYSTORE_BASE64=$(echo "$SIGNING_INFO" | cut -d'|' -f1)
          KEYSTORE_PASSWORD=$(echo "$SIGNING_INFO" | cut -d'|' -f2)
          KEY_ALIAS=$(echo "$SIGNING_INFO" | cut -d'|' -f3)
          KEY_PASSWORD=$(echo "$SIGNING_INFO" | cut -d'|' -f4)
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Error: Failed to parse ANDROID_SIGNING_COMBINED_SECRET. One or more parts are empty."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release.jks
          echo "SIGNING_KEYSTORE_FILE=$(pwd)/app/release.jks" >> $GITHUB_ENV
          echo "SIGNING_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
          echo "SIGNING_KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
          echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
        shell: bash

      # Step 2: Pure Main Project Build
      - name: Build release APKs with Gradle
        run: ./gradlew assembleRelease --${{ github.event.inputs.log_level }} --no-daemon

      - name: Upload APKs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: '**/build/outputs/apk/**/release/*.apk'
          retention-days: 7

      - name: Extract version name
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName "\K[^\"]*' app/build.gradle)
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Generate Release Tag
        id: generate_tag
        run: echo "tag_name=v$(date +'%Y-%m-%d-%H-%M-%S')-${{ github.ref_name }}" >> $GITHUB_OUTPUT

      - name: Upload APKs to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.generate_tag.outputs.tag_name }}
          name: Release ${{ steps.generate_tag.outputs.tag_name }}
          body: |
            Automated release from branch: ${{ github.ref_name }}
            Built from commit: ${{ github.sha }}
            Version: ${{ steps.version.outputs.version_name }}
          files: |
            **/build/outputs/apk/**/release/*.apk
          draft: true
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
