plugins {
    alias libs.plugins.android.library
}

android {
    namespace 'com.east.android.zlive'

    compileSdk {
        version = release(36) {
            it.minorApiLevel = 1
        }
    }

    defaultConfig {
        minSdk 23
        targetSdk 36
        ndk { abiFilters "armeabi-v7a" }
    }
}

dependencies {
    api libs.jna
}